[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fagrettila-dpoood"
version = "0.1.0"
description = "从样本里推断偏好优化的分布外表现应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fagrettila" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fagrettila.github.io"
Repository = "https://github.com/fagrettila/dpoood"
Issues = "https://github.com/fagrettila/dpoood/issues"

[project.scripts]
dpoood = "dpoood:main"

[tool.setuptools]
py-modules = ["dpoood"]
